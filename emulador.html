<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emulador</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    z-index: 10;
}

#loading h1 {
    margin-bottom: 10px;
}

#progresso {
    color: #aaa;
}

#erro {
    display: none;
    max-width: 700px;
    padding: 20px;
    text-align: center;
    color: #ff5555;
}

#game {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="loading">
    <h1>Carregando jogo...</h1>
    <div id="progresso">Preparando...</div>
    <div id="erro"></div>
</div>

<div id="game"></div>

<script src="jogo.js"></script>

<script>
const parametros = new URLSearchParams(window.location.search);
const id = parametros.get("jogo");

const progresso = document.getElementById("progresso");
const erro = document.getElementById("erro");
const loading = document.getElementById("loading");

async function juntarPartes(jogo) {
    const partes = [];

    for (let i = 1; i <= jogo.partes; i++) {
        progresso.textContent =
            "Carregando parte " + i + " de " + jogo.partes + "...";

        const resposta = await fetch(jogo.url + ".part" + i);

        if (!resposta.ok) {
            throw new Error(
                "Não foi possível carregar a parte " + i
            );
        }

        const dados = await resposta.arrayBuffer();
        partes.push(dados);
    }

    progresso.textContent = "Juntando arquivos...";

    const blob = new Blob(partes, {
        type: "application/octet-stream"
    });

    return URL.createObjectURL(blob);
}

async function iniciar() {
    try {
        if (!id) {
            throw new Error("Nenhum jogo foi selecionado.");
        }

        const jogo = JOGOS[id];

        if (!jogo) {
            throw new Error("Jogo não encontrado: " + id);
        }

        document.title = jogo.nome;

        let urlFinal;

        if (jogo.partes > 0) {
            urlFinal = await juntarPartes(jogo);
        } else {
            progresso.textContent = "Carregando jogo...";
            urlFinal = jogo.url;
        }

        progresso.textContent = "Iniciando EmulatorJS...";

        window.EJS_player = "#game";
        window.EJS_core = jogo.core;
        window.EJS_gameName = jogo.nome;
        window.EJS_gameUrl = urlFinal;
        window.EJS_pathtodata = "EmulatorJS-main/data/";

        const script = document.createElement("script");

        script.src = "EmulatorJS-main/data/loader.js";

        script.onload = function() {
            loading.style.display = "none";
        };

        script.onerror = function() {
            throw new Error(
                "Não foi possível carregar EmulatorJS-main/data/loader.js"
            );
        };

        document.body.appendChild(script);

    } catch (e) {
        console.error(e);

        loading.style.display = "flex";
        progresso.style.display = "none";
        erro.style.display = "block";
        erro.textContent = "Erro: " + e.message;
    }
}

iniciar();
</script>

</body>
</html>
