<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emulador</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    text-align: center;
}

#loading h1 {
    margin: 0 0 12px;
}

#progresso {
    color: #aaa;
}

#erro {
    display: none;
    max-width: 700px;
    padding: 20px;
    color: #ff5555;
    text-align: center;
}

#game {
    width: 100%;
    height: 100%;
}
</style>

</head>

<body>

<div id="loading">
    <h1>Carregando jogo...</h1>
    <div id="progresso">Preparando...</div>
    <div id="erro"></div>
</div>

<div id="game"></div>

<script src="jogo.js"></script>

<script>
const parametros = new URLSearchParams(window.location.search);
const id = parametros.get("jogo");

const progresso = document.getElementById("progresso");
const erro = document.getElementById("erro");
const loading = document.getElementById("loading");

const MAX_CONEXOES = 4;

function atualizarProgresso(texto) {
    progresso.textContent = texto;
}

async function baixarParte(url, numero, total) {
    const resposta = await fetch(url, {
        cache: "force-cache"
    });

    if (!resposta.ok) {
        throw new Error(
            "Não foi possível carregar a parte " + numero + " de " + total
        );
    }

    return resposta.arrayBuffer();
}

async function baixarPartes(jogo) {
    const urls = [];

    for (let i = 1; i <= jogo.partes; i++) {
        urls.push(jogo.url + ".part" + i);
    }

    const partes = new Array(jogo.partes);
    let proximaParte = 0;
    let concluidas = 0;

    async function trabalhador() {
        while (true) {
            const indice = proximaParte++;

            if (indice >= urls.length) {
                return;
            }

            const numero = indice + 1;

            atualizarProgresso(
                "Baixando partes... " +
                concluidas +
                " de " +
                jogo.partes
            );

            partes[indice] = await baixarParte(
                urls[indice],
                numero,
                jogo.partes
            );

            concluidas++;

            atualizarProgresso(
                "Baixando partes... " +
                concluidas +
                " de " +
                jogo.partes
            );
        }
    }

    const quantidadeTrabalhadores = Math.min(
        MAX_CONEXOES,
        jogo.partes
    );

    await Promise.all(
        Array.from(
            { length: quantidadeTrabalhadores },
            () => trabalhador()
        )
    );

    atualizarProgresso("Juntando arquivos...");

    const blob = new Blob(partes, {
        type: "application/octet-stream"
    });

    partes.length = 0;

    return URL.createObjectURL(blob);
}

async function prepararJogo(jogo) {
    if (!jogo.partes || jogo.partes <= 0) {
        atualizarProgresso("Carregando jogo...");
        return jogo.url;
    }

    return baixarPartes(jogo);
}

function carregarEmulatorJS(jogo, url) {
    window.EJS_player = "#game";
    window.EJS_core = SISTEMAS[jogo.sistema].core;
    window.EJS_gameName = jogo.nome;
    window.EJS_gameUrl = url;
    window.EJS_pathtodata = "EmulatorJS-main/data/";

    const script = document.createElement("script");

    script.src = "EmulatorJS-main/data/loader.js";

    script.onload = function() {
        atualizarProgresso("EmulatorJS carregado.");
    };

    script.onerror = function() {
        throw new Error(
            "Não foi possível carregar EmulatorJS-main/data/loader.js"
        );
    };

    document.body.appendChild(script);
}

async function iniciar() {
    try {
        if (!id) {
            throw new Error("Nenhum jogo foi selecionado.");
        }

        const jogo = JOGOS[id];

        if (!jogo) {
            throw new Error("Jogo não encontrado: " + id);
        }

        const sistema = SISTEMAS[jogo.sistema];

        if (!sistema) {
            throw new Error(
                "Sistema não configurado: " + jogo.sistema
            );
        }

        document.title = jogo.nome;

        const urlFinal = await prepararJogo(jogo);

        atualizarProgresso("Iniciando EmulatorJS...");

        carregarEmulatorJS(jogo, urlFinal);

        setTimeout(function() {
            loading.style.display = "none";
        }, 1000);

    } catch (e) {
        console.error(e);

        loading.style.display = "flex";
        progresso.style.display = "none";
        erro.style.display = "block";
        erro.textContent = "Erro: " + e.message;
    }
}

iniciar();
</script>

</body>
</html>
